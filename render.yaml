services:
  - type: web
    name: aecai-api
    runtime: docker
    rootDir: backend
    envVars:
      - key: CORS_ORIGINS
        value: https://aecai.vercel.app,https://aecai-*.vercel.app,http://localhost:3000
      - key: AECAI_TEMPLATE_DPI
        value: "150"
    healthCheckPath: /api/health
    plan: free
